name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Create artifacts directory
        run: mkdir -p dist_artifacts

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "VERSION=${TAG_NAME#v}" >> $GITHUB_ENV

      - name: Build Linux Version
        run: mvn clean package -B -P Linux-64

      - name: Save Linux Artifact
        run: cp target/pgsqlblocks-${{ env.VERSION }}-Linux-64.jar dist_artifacts/

      - name: Build Windows Version
        run: mvn clean package -B -P Windows-64 -DskipTests

      - name: Save Windows Artifact
        run: cp target/pgsqlblocks-${{ env.VERSION }}-Windows-64.jar dist_artifacts/

      # Сборка macOS
      - name: Build macOS Version
        run: mvn clean package -B -P Macosx-64 -DskipTests

      - name: Save macOS Artifact
        run: cp target/pgsqlblocks-${{ env.VERSION }}-Macosx-64.jar dist_artifacts/

      # Проверка собранных файлов в логах (для отладки)
      - name: List Ready Artifacts
        run: ls -la dist_artifacts/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b #v.3.0.1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist_artifacts/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
